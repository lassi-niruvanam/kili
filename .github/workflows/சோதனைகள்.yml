name: கிளி சோதனைகள்
on:
  push:
    branches:
      - மத்திய
  pull_request:
    branches:
      - மத்திய

jobs:
  test-ipa-nodejs:
    name: கணினியில் சோதனைகள்
    runs-on: ubuntu-latest
    steps:
      
      - name: Ouvrir la branche
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Préparation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Installer
        run: pnpm install

      - name: Installer playwright
        run: npx playwright install

      - name: Vérifier les tests
        run: pnpm சோதனை:கணு

      - name: Envoyer couverture à Codecov
        uses: codecov/codecov-action@v5
  
  test-ipa-navig:
    name: உலாவியில் சோதனைகள்
    runs-on: ubuntu-latest
    steps:
      
      - name: Ouvrir la branche
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Préparation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Installer
        run: pnpm install

      - name: Installer playwright
        run: npx playwright install

      - name: Vérifier les tests
        run: pnpm சோதனை:உலாவி

      - name: Envoyer couverure à Codecov
        uses: codecov/codecov-action@v5

  test-ipa-electron-principal:
    name: எதிர்மின்னி-முதன்மையானது
    needs: test-ipa-nodejs
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      
      - name: Ouvrir la branche
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Préparation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: 'pnpm'

      - name: Installer
        run: pnpm install

      - name: Installer playwright
        run: npx playwright install

      - name: Vérifier les tests
        # De cawa-93/vite-electron-builder
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- pnpm run சோதனை:எதிர்மின்னி-முதன்மையானது
        if: matrix.os == 'ubuntu-latest'

      - run: pnpm run சோதனை:எதிர்மின்னி-முதன்மையானது
        if: matrix.os != 'ubuntu-latest'

      - name: Envoyer couverture à Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
